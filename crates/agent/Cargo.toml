[package]
name = "yonder-agent"
description = "Yonder agent: runs on a machine you want to use remotely"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
yonder-core.workspace = true
clap.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_NetworkManagement_NetManagement", "Win32_Security_Authentication_Identity", "Win32_System_Console", "Win32_System_Environment", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_RemoteDesktop", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_Pipes"] }
png = "0.18"
rand = "0.10"

[build-dependencies]
winresource = "0.1.34"
