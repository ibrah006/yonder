[package]
name = "yonder-cli"
description = "Yonder command line: run work on your other machines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "yonder"
path = "src/main.rs"

[dependencies]
yonder-core.workspace = true
clap.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util", "process", "sync"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
crossterm = "0.29"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
