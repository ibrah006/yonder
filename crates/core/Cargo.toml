[package]
name = "yonder-core"
description = "Shared identity, connection and protocol code for Yonder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1"
globset = "0.4"
data-encoding = "2"
directories = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gethostname = "1.1.0"
iroh = "1.4.1"
portable-pty = "0.9.0"
postcard = { version = "1", features = ["use-std"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "process", "fs"] }
tracing = "0.1"
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Power", "Win32_Security", "Win32_System_SystemInformation"] }
